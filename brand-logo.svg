<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="宵荧系列 Teneglim Series">
  <title>宵荧系列 Teneglim Series</title>
  <defs>
    <linearGradient id="tl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131b3d" />
      <stop offset="1" stop-color="#05080f" />
    </linearGradient>
    <linearGradient id="tl-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0e0a8" />
      <stop offset="1" stop-color="#c9902f" />
    </linearGradient>
    <linearGradient id="tl-flame" x1="32" y1="14" x2="32" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff6d8" />
      <stop offset="0.35" stop-color="#f0e0a8" />
      <stop offset="1" stop-color="#c9902f" />
    </linearGradient>
    <linearGradient id="tl-arc" x1="11" y1="38" x2="53" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d4a93c" stop-opacity="0.12" />
      <stop offset="0.5" stop-color="#f0e0a8" stop-opacity="0.95" />
      <stop offset="1" stop-color="#d4a93c" stop-opacity="0.12" />
    </linearGradient>
    <radialGradient id="tl-glow" cx="32" cy="33" r="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d4a93c" stop-opacity="0.36" />
      <stop offset="1" stop-color="#d4a93c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 宵 · 夜色徽底 -->
  <rect width="64" height="64" rx="15" fill="url(#tl-bg)" />
  <rect x="3.5" y="3.5" width="57" height="57" rx="12.5" fill="none" stroke="url(#tl-edge)" stroke-width="1.2" opacity="0.85" />

  <g transform="translate(7 7) scale(0.78)">
    <!-- 星野 -->
    <g fill="#f0e0a8">
      <circle cx="14" cy="23" r="1.3" opacity="0.5" />
      <circle cx="21" cy="14" r="0.9" opacity="0.4" />
      <circle cx="51" cy="31" r="1" opacity="0.45" />
      <circle cx="45" cy="52" r="0.9" opacity="0.4" />
    </g>

    <!-- 光晕 -->
    <circle cx="32" cy="33" r="19" fill="url(#tl-glow)" />

    <!-- 系列之光：四芒星 -->
    <path
      d="M47 12.5c.9 4 1.5 4.6 5.5 5.5-4 .9-4.6 1.5-5.5 5.5-.9-4-1.5-4.6-5.5-5.5 4-.9 4.6-1.5 5.5-5.5z"
      fill="#f0e0a8"
      opacity="0.9"
    />

    <!-- 夜幕 -->
    <path
      d="M11 38c8 11 34 11 42 0"
      fill="none"
      stroke="url(#tl-arc)"
      stroke-width="2.4"
      stroke-linecap="round"
    />
    <path
      d="M15 42.5c6 7.5 28 7.5 34 0"
      fill="none"
      stroke="#d4a93c"
      stroke-width="1.2"
      stroke-linecap="round"
      opacity="0.26"
    />

    <!-- 荧 · 火光 -->
    <path
      d="M32 14c5.2 7.6 10.5 11.6 10.5 19.2 0 6.6-4.7 11.8-10.5 11.8S21.5 39.8 21.5 33.2C21.5 25.6 26.8 21.6 32 14z"
      fill="url(#tl-flame)"
    />
    <path
      d="M32 25.5c2.6 4 5.2 6.2 5.2 9.9 0 3.9-2.3 6.6-5.2 6.6s-5.2-2.7-5.2-6.6c0-3.7 2.6-5.9 5.2-9.9z"
      fill="#fffaf0"
      opacity="0.72"
    />
  </g>
</svg>
